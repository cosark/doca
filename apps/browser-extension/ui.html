<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Doca</title>
    <link rel="stylesheet" href="ui.css" />
  </head>
  <body>
    <header>
      <img src="icon.svg" width="30" height="30" alt="" />
      <div>
        <strong>Doca</strong><small id="identity">Browser Assistant</small>
      </div>
      <select id="locale" aria-label="Language">
        <option value="zh">中文</option>
        <option value="en">English</option>
      </select>
    </header>
    <nav aria-label="Doca">
      <button data-tab="capture" data-label="capture" class="active"></button
      ><button data-tab="assistant" data-label="assistant"></button
      ><button data-tab="connection" data-label="connection"></button>
    </nav>
    <main>
      <div id="notice" role="status" aria-live="polite" hidden></div>
      <section id="capture-pane">
        <h1 data-label="capture"></h1>
        <p class="muted" data-label="description"></p>
        <label class="field"
          ><span data-label="profile"></span
          ><select id="profile"></select
        ></label>
        <p id="profile-detail" class="profile-detail"></p>
        <button
          id="capture-page"
          class="primary wide"
          data-label="page"
        ></button
        ><button
          id="capture-selection"
          class="secondary wide"
          data-label="selection"
        ></button>
        <button
          id="retry"
          class="text-button wide"
          data-label="retry"
          hidden
        ></button>
        <p class="muted small" data-label="loadedOnly"></p>
        <button
          id="open-assistant"
          class="secondary wide"
          data-label="openAssistant"
        ></button>
        <a
          id="settings-link"
          class="settings-link"
          target="_blank"
          rel="noopener noreferrer"
          data-label="settings"
        ></a>
      </section>
      <section id="assistant-pane" hidden>
        <div class="assistant-controls">
          <label
            ><span data-label="profile"></span
            ><select id="ai-profile" aria-label="Capture profile"></select
          ></label>
          <label
            ><span data-label="model"></span
            ><select id="model" aria-label="Model"></select
          ></label>
          <button
            id="new-chat"
            class="text-button"
            data-label="newChat"
          ></button>
        </div>
        <div id="conversation" aria-live="polite"></div>
        <form id="composer">
          <label class="attach"
            ><input type="checkbox" id="attach-page" /><span
              data-label="attach"
            ></span
          ></label>
          <p class="muted small" data-label="sendHelp"></p>
          <textarea
            id="prompt"
            rows="3"
            maxlength="18000"
            data-placeholder="prompt"
          ></textarea>
          <div class="composer-actions">
            <a
              id="continue-link"
              target="_blank"
              rel="noopener noreferrer"
              data-label="continue"
              hidden
            ></a
            ><button
              id="send"
              class="primary"
              type="submit"
              data-label="send"
            ></button>
          </div>
        </form>
      </section>
      <section id="connection-pane" hidden>
        <h1 id="connection-heading" data-label="notConnected"></h1>
        <p class="muted" data-label="setup"></p>
        <p id="connection-detail" class="connection-detail"></p>
        <button id="login" class="primary wide" data-label="login"></button>
        <form id="endpoint-form">
          <label class="field"
            ><span data-label="endpoint"></span
            ><input
              id="endpoint"
              type="url"
              placeholder="https://doca.example.com"
              required
          /></label>
          <p class="muted small" data-label="endpointHelp"></p>
          <button
            type="submit"
            class="secondary wide"
            data-label="saveEndpoint"
          ></button>
        </form>
        <details id="advanced-config">
          <summary data-label="advancedConfig"></summary>
          <form id="configure">
            <label class="field"
              ><span data-label="config"></span
              ><textarea
                id="config"
                rows="7"
                spellcheck="false"
                data-placeholder="paste"
                required
              ></textarea>
            </label>
            <p class="muted small" data-label="importHelp"></p>
            <button
              class="primary wide"
              type="submit"
              data-label="import"
            ></button>
          </form>
        </details>
      </section>
    </main>
    <script type="module" src="ui.js"></script>
  </body>
</html>
